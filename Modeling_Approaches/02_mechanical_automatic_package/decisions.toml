# Modelling decision log: every decision that changes what the pipeline fits or controls, newest last.
# build_final_report.jl shows it at the top of the Final Report, next to the settings it reads from
# stages.toml and control_config.toml, and archives both with every report version
# (docs/outputs/final_report/history/), so versions can be compared decision by decision.
# Add an entry here whenever a setting is changed on purpose; the settings themselves stay in their configs.
#   date      the day the decision was made
#   area      fitting, data, selection, control
#   decision  what was decided, in one sentence
#   was       the previous choice ("" for a new feature)
#   by        who decided (user, review, ...)
#   where     the config key or file that holds it

