# Every raw data source of the pipeline, tagged with its experimental conditions.
# build_tidy.jl reads these files and writes one row per measurement to measurements.csv.
#
# To add data: add a [[source]] with its file (relative to the CancerGrowthDynamics root), the sheet
# for .xlsx files, and the tags below; then rerun `julia --project=. data/build_tidy.jl`.
#
# tags
#   experiment   data set the source belongs to
#   condition    experimental condition label (untreated, treated, Ce0, Ce1, low_resource, combination, intermittent)
#   line         A2780 (sensitive) or A2780cis (resistant): the population this series counts
#   culture      mono or co (co: the other line shares the well; `ratio` gives sensitive:resistant at seeding)
#   ratio        25S75R | 50S50R | 75S25R for cocultures, 100 for monocultures
#   run          experimental run (replicate experiment) within the data set
#   seeding      cells seeded per well, total
#   fbs          serum in the medium, % (10 normal, 0.5 low resource)
#   schedule     dose schedule D(t), a name in schedules.toml
#   value_col    column holding the measurement; sd_col / sem_col / n_col optional
#   units        what the value counts
#   time_origin  the day taken as t = 0; earlier days are kept but excluded (default 0)
#   qc           rules from qc_rules.toml applied to this series (default none)

# ── untreated monocultures (Stage 1) ─────────────────────────────────────────
[[source]]
id = "mono_untreated_A2780"
experiment = "new_datasets"
condition = "untreated"
line = "A2780"
culture = "mono"
ratio = "100"
run = 1
seeding = 30000
fbs = 10.0
schedule = "const_0"
file = "New Datasets/A2780_Untreated_30k 1.csv"

[[source]]
id = "mono_untreated_A2780cis"
