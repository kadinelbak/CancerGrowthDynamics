# ── intermittent dosing monocultures (validation only; never fitted) ─────────
# Values are image areas already normalised to cell size (user, 2026-10-01), so ≈ cell counts.
# The series start at day 1 (no day-0 row); the dose switches at day 7.
[[source]]
id = "mono_intermittent_onoff_A2780"
experiment = "intermittent"
condition = "intermittent"
line = "A2780"
culture = "mono"
ratio = "100"
run = 1
seeding = 30000
fbs = 10.0
schedule = "on0_off7"
file = "Processed_Datasets/Intermittent Data/30k_seeding_density/Averages/A2780T_dayaverages.csv"
value_col = "Mean_Cells_um2"
sd_col = "Std_Dev_Cells"
sem_col = "Std_Error_Cells"
n_col = "Sample_Count"
units = "cell area normalised to cell size"

