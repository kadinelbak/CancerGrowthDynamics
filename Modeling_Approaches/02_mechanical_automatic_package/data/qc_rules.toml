# Quality-control rules. A rule only applies to the sources that list it (sources.toml, `qc`).
# Excluded points stay in measurements.csv with excluded = true and the reason; they are never deleted.
#
# User decision 2026-10-02: keep the current behaviour exactly. The two rules below are applied to the
# low-resource monocultures, the low-resource cocultures and the Stage 4 combination culture only; the
# untreated, treated and Ce0/Ce1 coculture sources list no rules. Listing a rule on another source
# switches it on there (and changes that stage's fit).

[exact_duplicate]
# a value (> 0) that exactly repeats an earlier day's value of the same series is a copy error
description = "exact duplicate of an earlier day"

[transient_drop]
# a point below `frac` × the last kept value, by more than `floor` cells, followed later by a recovery
# to at least `recover` × that value, is an imaging artefact rather than cell death
description = "transient drop"
frac = 0.5
recover = 0.8
floor = 50.0
