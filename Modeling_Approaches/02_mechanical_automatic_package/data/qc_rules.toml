# Quality-control rules. Excluded points stay in measurements.csv with excluded = true and the reason; they
# are never deleted.
#
# Since 2026-10-07 (review; user: "choose the simply best option") every rule in `apply_to_all` is applied to
# every source (before, only the low-resource and Stage 4 sources listed rules), the transient rule is
# symmetric (drops and spikes), and in a coculture a day flagged in one line is flagged in the other line of
# the same well too (the artefact is in the image, not in one population). A source may still list extra
# rules in its own `qc`.
apply_to_all = ["exact_duplicate", "transient_drop", "transient_spike"]

[exact_duplicate]
# a value (> 0) that exactly repeats an earlier day's value of the same series is a copy error
description = "exact duplicate of an earlier day"

[transient_drop]
# a point below `frac` × the last kept value, by more than `floor` cells, followed later by a recovery
# to at least `recover` × that value, is an imaging artefact rather than cell death
description = "transient drop"
frac = 0.5
recover = 0.8
floor = 50.0

[transient_spike]
# the mirror image of transient_drop: a point above last-kept-value / `frac`, by more than `floor` cells, whose
# next kept point falls back to at most last-kept-value / `recover`, is an imaging artefact rather than growth
description = "transient spike"
frac = 0.5
recover = 0.8
floor = 50.0

[terminal_collapse]
# fix review X4 (user, 2026-11-09), cocultures only, applied in build_tidy.jl after the per-well flags: on one of
# the last `last_days` measured days, one line falls below `frac` × the median of its previous `window` kept points
# while the other line rises above median / `frac` (each by more than `floor` cells). Both points are excluded
# (Stage 3b run 2 · 1:3, day 12: A2780 1,836 → 336 while A2780cis 31 → 99).
description = "terminal collapse (late opposite jump of the two lines of a well)"
frac = 0.6
floor = 50.0
window = 3
last_days = 2
