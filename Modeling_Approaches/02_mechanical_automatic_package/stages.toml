  # shared K with one-for-one crowding; the others add asymmetric crowding (and, where noted, the coculture
  # deaths). Delay: the kill factor and the protection act on the Stage 2b kill, so they inherit its
  # 3-compartment delay; the cytostatic effect is offered immediate ("imm", follows the dose) and delayed
  # ("delay", follows each line's Stage 2b chain), and its cytostatic-only variants can refit the delay rate.
  # No new compartments: every line keeps at most 3 (MAX_COMPARTMENTS).
  [[stage.candidate]]
  name = "cc_K_phi"
  label = "Shared K, one kill factor for both lines (stand-alone)"
  family = "Coculture kill factor"
  free = ["K", "φ"]
  [[stage.candidate]]
  name = "cc_K_alpha_phi"
  label = "Shared K + crowding, one kill factor for both lines"
  family = "Coculture kill factor"
  free = ["K", "αNC", "αCN", "φ"]
  [[stage.candidate]]
  name = "cc_K_alpha_phiN"
  label = "Shared K + crowding, sensitive kill factor"
  family = "Coculture kill factor"
  free = ["K", "αNC", "αCN", "φN"]
  [[stage.candidate]]
  name = "cc_K_alpha_phiC"
