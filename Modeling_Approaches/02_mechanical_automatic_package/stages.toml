  family = "Coculture kill factor"
  free = ["K", "αNC", "αCN", "φC"]
  [[stage.candidate]]
  name = "cc_K_alpha_phiNC"
  label = "Shared K + crowding, kill factor per line"
  family = "Coculture kill factor"
  free = ["K", "αNC", "αCN", "φN", "φC"]
  [[stage.candidate]]
  name = "cc_K_phiNC"
  label = "Shared K, kill factor per line (stand-alone)"
  family = "Coculture kill factor"
  free = ["K", "φN", "φC"]
  [[stage.candidate]]
  name = "cc_K_alpha_death_phi"
  label = "Shared K + crowding + coculture death, one kill factor"
  family = "Coculture kill factor"
  free = ["K", "αNC", "αCN", "dN", "dC", "φ"]
  [[stage.candidate]]
  name = "cc_K_alpha_death_phiNC"
  label = "Shared K + crowding + coculture death, kill factor per line"
  family = "Coculture kill factor"
  free = ["K", "αNC", "αCN", "dN", "dC", "φN", "φC"]
