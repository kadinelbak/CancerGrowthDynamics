# The fitting stages of the model zoo, run in this order by run_zoo_fits.jl.
# Ids are internal (s1, s1b, s2, s3, s3b, s4); pages show the thesis names 1, 2a, 2b, 3a, 3b, 4
# (stage_names.jl). Each stage selects its data by tag (data/sources.toml), inherits the carried
# models of earlier stages, fits its candidates and carries one model forward by the selection rule.
#
# kind
#   growth       per line: growth laws (no input)
#   mechanism    per line: growth from `inherits.growth` + every mechanism of `catalogue` (zoo_models.jl)
#                driven by `input` (D = cisplatin, R = low resource)
#   coculture    both lines per well, one shared K: each line's mechanism from `inherits.mechanism`,
#                candidates name which coculture parameters are refitted
#   combination  both lines with two mechanism modules each (zoo_stage4.jl)
# data         tag selector; a list value matches any of its entries. Environments are the distinct
#              (condition, ratio, run) combinations in sources.toml order.
# joint_rule   paired-line rule for per-line stages (zoo_selection.jl): "shared" = one structure for both
#              lines chosen on the joint BIC; "ab" = a shared structure is tested and kept only if it wins.
# kill_growth_coupled (optional, drug stages and coculture candidates): Norton–Simon, the drug kill is
#              multiplied by the line's growth factor (1 − x, or 1 − x^θ); off unless set.
# [selection] options: residual_weighting = "none" | "sd" | "power" (weight_power), bootstrap_generator =
#              "most_complex" | "selected" (README, "Sensitivity runs").

[lines.A2780]
sym = "N"
ec50 = 1.0              # µM, measured cisplatin IC50 of A2780 (the Hill kill's EC50)

[lines.A2780cis]
sym = "C"
ec50 = 8.34             # µM, measured cisplatin IC50 of A2780cis (user, 2026-10-02; was 1 µM for both lines before)

# Starting values (user, 2026-11-02; zoo_data.jl x0_info): "mono" estimates the day-0 count of every monoculture series
# as a free parameter (bounds nom/10 to 3 × max(nom, first count), counted in the BIC); cocultures keep the 3-fold
# rule. The A2780cis monocultures start 20–60% apart on day 1 (untreated 80, 0.62 and 1 µM about 118 for a nominal
# 100), an offset the fixed start pushed into r_C, θ_C (5.5) and the drug delay. "auto" = the 3-fold rule only.
[starting_values]
# fix review X2 (user, 2026-11-09): day 0 is the nominal seeding, never measured, and plates differ in imaging
# scale (low-resource day-1 counts 3–16 × nominal, others 0.4–2 ×), so every series' start is estimated ("all";
# was "mono" since 2026-11-02) inside a band anchored on its first measured count y1 at day t1:
# [y1 / (day1_fold · e^(day1_rmax · t1)), day1_fold · y1] (anchor = "day1"; "nominal" = the old 0.1 × nominal to
# 3 × max(nominal, y1) band, which let Stage 3b run 2 · 1:3 sit at 2.5 cells against a day-1 count of 159)
estimate = "all"
anchor = "day1"
day1_fold = 3.0
day1_rmax = 1.0

[selection]
rule_bic = 2.0          # carried model: fewest free parameters within rule_bic of the lowest BIC (ties: lower BIC); was 3.0 until 2026-10-27 (user)
# Residual weights (review, 2026-10-07): one pooled variance model for every series, scale = max(y, 50)^0.55
# (the log-log slope of replicate SD against the mean count over all series; 50 cells = a noise floor). This
# replaces the per-point 3-well SDs, which have 2 degrees of freedom each and, with per-series floors, made
# weights between series differ up to 3500-fold. Raw squared error would let the large late counts dominate.
residual_weighting = "power"
weight_power = 0.55
# Bootstrap replicates are generated from the carried model, so its intervals are centred on its estimates;
# replicates from the most complex candidate biased the selection frequencies against simpler models.
bootstrap_generator = "selected"
# Work budget per bootstrap optimiser run, × the right-hand-side evaluations of one refit to the original data
# (2026-10-28, after one Stage 4 replicate ran for 11+ h). A count, not a time limit, so results stay
# reproducible; runs over budget are discarded for that replicate and listed in time_limit_hits.csv. 0 = none.
bootstrap_work_factor = 50
# Multistart (user, 2026-11-02, F5 of the decision review): on top of the fixed starts of each candidate, extra_starts
# seeded Latin-hypercube starts inside the bounds (log-uniform over a range spanning more than 100×) for the main
# fits only; the bootstrap keeps one start at the estimate. fit_starts.csv lists, per candidate, how many starts
# reached the best BIC (within 0.01). EXTRA_STARTS overrides; 0 = the fixed starts only (the setting before).
extra_starts = 20
# where and how long the seeded starts run (bootstrap_tools.jl lhs_starts, fit_cand): each parameter is drawn within
# extra_starts_spread × below/above its fixed starts (clipped to the bounds; 0 = the whole bounds), and each seeded
# start may use extra_starts_work_factor × the evaluations of the slowest fixed-start fit (0 = no budget)
extra_starts_spread = 10
extra_starts_work_factor = 20
# Two-pass bootstrap (user, 2026-11-01): every candidate is refitted to the first bootstrap_screen replicates; the
# remaining ones go only to candidates that were within rule_bic of the lowest BIC in at least one screened
# replicate (so the per-line and paired-line rules could pick them), plus the carried model. A candidate
# never picked in 40 replicates would be picked in under ~7% (95% bound); in the 28 Oct run 75 of 132 candidates
# were never picked in all 200, so this roughly halves the bootstrap refits. 0 = every candidate gets all B.
bootstrap_screen = 40

[coculture]
# bounds of refitted coculture parameters; K is bounded relative to the data maximum
bounds = { K = [0.5, 20.0], "αNC" = [0.0, 5.0], "αCN" = [0.0, 5.0], "βN" = [0.0, 10.0], "βC" = [0.0, 10.0], dN = [0.0, 3.0], dC = [0.0, 3.0], "εN" = [0.0, 5.0], "εC" = [0.0, 5.0], "φ" = [0.0, 5.0], "φN" = [0.0, 5.0], "φC" = [0.0, 5.0], "ρN" = [0.0, 50.0], "ρC" = [0.0, 50.0], "γN" = [0.0, 1.0], "γC" = [0.0, 1.0], "ηN" = [0.0, 3.0], "ηC" = [0.0, 3.0], kN = [0.001, 20.0], kC = [0.001, 20.0], "μ0" = [0.0, 0.5], "μD" = [0.0, 2.0] }

# ── 1 · untreated monocultures ────────────────────────────────────────────────
[[stage]]
id = "s1"
kind = "growth"
stage_label = "1 Untreated monoculture"
title = "Stage 1 · {line} untreated"
data = { condition = "untreated", culture = "mono" }
# K bounds and starts are multiples of the series maximum
  [[stage.candidate]]
  name = "logistic"
  label = "Logistic"
  growth = "logistic"
  free = ["r", "K"]
  bounds = [[1e-4, 5.0], [0.5, 20.0]]
  starts = [[0.6, 1.05], [0.3, 1.3], [1.0, 1.0]]
  [[stage.candidate]]
  name = "theta_logistic"
  label = "Theta logistic"
  growth = "theta"
  free = ["r", "K", "θ"]
  bounds = [[1e-4, 10.0], [0.5, 20.0], [0.05, 10.0]]
  starts = [[0.6, 1.05, 1.0], [0.4, 1.1, 3.0], [1.0, 1.0, 0.5]]
  [[stage.candidate]]
  name = "gompertz"
  label = "Gompertz"
  growth = "gompertz"
  free = ["r", "K"]
  bounds = [[1e-4, 5.0], [0.5, 20.0]]
  starts = [[0.3, 1.05], [0.15, 1.3], [0.6, 1.0]]

# ── 2a · low-resource monocultures ────────────────────────────────────────────
[[stage]]
id = "s1b"
kind = "mechanism"
stage_label = "1b Low-resource monoculture"
title = "Stage 1b · {line} low resource"
data = { condition = "low_resource", culture = "mono" }
input = "R"
catalogue = "LR_ZOO"
inherits = { growth = "s1" }
joint_rule = "ab"
plot_tmax = 20.0

# ── 2b · treated monocultures, all doses jointly ─────────────────────────────
[[stage]]
id = "s2"
kill_growth_coupled = true   # Norton–Simon kill (user, 2026-10-06; sensitivity variant V5)
kind = "mechanism"
stage_label = "2 Treated monoculture"
title = "Stage 2 · {line} treated (measured doses jointly)"
data = { condition = "treated", culture = "mono" }
# user, 2026-11-02 (D5 of the decision review): the A2780cis 1 µM monoculture is fitted again; it tracks the 0.62 µM
# series at 0.7–0.85 × untreated from day 10, and only its day-14 count (4,117, above untreated) is left out, by
# hand in data/sources.toml (exclude_days). 2026-10-27 to 2026-11-02 the whole series was left out here
# (exclude = [{ line = "A2780cis", dose = 1.0 }]). ZOO_NO_EXCLUDE=1 refits with every point (sensitivity variant).
input = "D"
catalogue = "DRUG_ZOO"
inherits = { growth = "s1" }
joint_rule = "shared"
# fix review X6 / X13 (user, 2026-11-09): the coupled catalogue entries are joined by the same mechanisms with the
# kill not tied to growth ("_unc"; for the damage entries this is an arrested state: cells stop dividing, stay
# counted and take space, and die at δ) and with partial coupling, growth factor^p fitted in [0, 1] ("_nsp")
uncoupled = ["chain2_loss", "chain3_loss", "comp_loss", "chain2_damage", "comp_damage"]
partial = ["chain2_loss", "chain3_loss"]

# ── 3a · untreated (Ce0) and treated (Ce1) cocultures, shared K ──────────────
[[stage]]
id = "s3"
kill_growth_coupled = true   # Norton–Simon kill (user, 2026-10-06; sensitivity variant V5)
kind = "coculture"
stage_label = "3 Ce0 + Ce1 coculture"
title = "Stage 3 · Ce0 + Ce1 coculture (shared K)"
line = "coculture"
data = { culture = "co", condition = ["Ce0", "Ce1"] }
input = "D"
inherits = { growth = "s1", mechanism = "s2" }
# Treatment is NOT refitted in coculture (user, 2026-11-03): both lines keep their Stage 2b kill (β, k) unchanged
# in the treated cocultures (Ce1). Only the coculture terms are refitted, on Ce0 and Ce1 jointly: shared K, the
# crowding coefficients α_NC, α_CN and the extra coculture deaths d_N, d_C. They may shrink to 0 but never turn
# negative (bounds in [coculture]), so a line can be released from crowding but not helped by the other line.
# The crowding values are the same in treated and untreated wells, so the drug effect cannot hide in them.
# 2026-11-02 to 2026-11-03 β_N and β_C were refitted here (β_C floored at 0.1 × Stage 2b, it sat on the floor);
# before that β_C could reach 0. betaC_floor is kept for the record but no candidate frees β any more.
betaC_floor = 0.1
  [[stage.candidate]]
  name = "cc_K"
  label = "Shared K, one-for-one crowding, drug mechanisms from Stage 2"
  free = ["K"]
  [[stage.candidate]]
  name = "cc_K_alpha"
  label = "Shared K + asymmetric crowding, drug mechanisms from Stage 2"
  free = ["K", "αNC", "αCN"]
  [[stage.candidate]]
  name = "cc_K_alpha_deathN"
  label = "Shared K + crowding + sensitive coculture death, drug mechanisms from Stage 2"
  free = ["K", "αNC", "αCN", "dN"]
  [[stage.candidate]]
  name = "cc_K_alpha_deathC"
  label = "Shared K + crowding + resistant coculture death, drug mechanisms from Stage 2"
  free = ["K", "αNC", "αCN", "dC"]
  [[stage.candidate]]
  name = "cc_K_alpha_death"
  label = "Shared K + crowding + coculture death, drug mechanisms from Stage 2"
  free = ["K", "αNC", "αCN", "dN", "dC"]
  # ── coculture interaction models (user, 2026-11-08) ─────────────────────────────────────────────
