<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentation — A2780 staged fitting (live)</title>
<link rel="stylesheet" href="site.css">
<style>
html,body{height:100%;margin:0;background:#0f1d27;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;padding:6px 12px;background:#0f1d27;color:#c9d6de;font:13px system-ui}
#bar a,#bar button{color:#c9d6de;background:#1c3040;border:0;border-radius:6px;padding:5px 10px;text-decoration:none;font:600 12px system-ui;cursor:pointer}
#bar .count{margin-left:auto}
#viewport{position:fixed;top:38px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
#deck{position:relative;width:1600px;height:900px;transform-origin:center center}
.slide.title{justify-content:center}
.slide{position:absolute;inset:0;background:#f6f4ee;color:#16283a;padding:56px 72px;display:flex;flex-direction:column;gap:18px;visibility:hidden;opacity:0;transition:opacity .25s;overflow:hidden;border-radius:6px}
.slide.on{visibility:visible;opacity:1}
.slide.dark{background:#16283a;color:#f6f4ee}
.slide h1{font:600 64px/1.1 Georgia,serif;color:inherit;margin:0}
.slide h2{font:600 42px/1.15 Georgia,serif;color:#16283a;margin:0}
.slide .sub{font-size:20px;color:#4a5866;margin:0}
.slide.dark .sub{color:#b9c9d3}
.eyebrow{font:700 16px system-ui;letter-spacing:.08em;text-transform:uppercase;color:#0b6e99}
.slide.dark .eyebrow{color:#8ccbe6}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;flex:1;min-height:0}
.mcard{background:#fff;border:1px solid #d6dee3;border-radius:12px;padding:10px 16px;margin-bottom:12px}
.mcard.opt{border:3px solid #0b6e99}
.cols.multi{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.multi .mcard .eq{font-size:12.5px;padding:0 8px;margin:2px 0}.multi .plist{font-size:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.pair .mcard{margin:0}
.mcard .tag{font-size:13px}
.mcard h3{font:650 22px/1.2 system-ui;margin:4px 0}
.mcard .stats{font-size:15px}
.mcard .eq{font-size:15px;border:0;background:#f7fafb;margin:4px 0}
.plist{font-size:15px;margin:4px 0 0;padding-left:18px;columns:2;column-gap:22px}
.plist li{margin:2px 0}
.big table{font-size:18px}.big th,.big td{padding:8px 10px}
.bul{font-size:22px;line-height:1.42;margin:0;padding-left:28px}.bul li{margin:6px 0}
/* keep tall stage slides inside the 1600x900 frame: the model card scrolls, the plot scales down */
.cols.multi>div{min-height:0;overflow:hidden}.cols.multi .mcard{max-height:100%;overflow:auto}.cols.multi svg{max-height:100%;width:auto;max-width:100%}
.foot{position:absolute;left:72px;right:72px;bottom:22px;font-size:14px;color:#6b7782;display:flex;justify-content:space-between}
.slide.dark .foot{color:#9fb2bf}
svg.plot{border:1px solid #d6dee3}
.glance table{font-size:17px}.glance td{vertical-align:top;padding:8px 10px}.glance .geq{font-size:14px;overflow-x:auto;max-width:980px}.glance .geq mjx-container[display]{margin:.1em 0 !important;text-align:left !important}
</style>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script>/* always load the latest run */ var __v = Date.now(); document.write('<script src="bundle.js?' + __v + '"><\/script><script src="site.js?' + __v + '"><\/script><script src="control.js?' + __v + '"><\/script><script src="controlLong.js?' + __v + '"><\/script>');</script>
</head><body>
<div id="bar"><a href="../../index.html">⌂ Home</a><a href="summary.html">Summary</a><a href="explorer.html">Explorer</a><a href="../final_report/report.html">Final report</a>
  <button id="fs">Full screen (F)</button><span class="muted" style="color:#9fb2bf">← → to move</span><span class="count" id="count"></span></div>
<div id="viewport"><div id="deck"></div></div>
<script>
const deck = document.getElementById('deck');
const slides = [];
const foot = n => `<div class="foot"><span>A2780 / A2780cis staged fitting · live results</span><span>${RES ? 'run ' + esc(RES.generated) : ''}</span></div>`;
function add(html, cls = '') { slides.push(`<section class="slide ${cls}">${html}</section>`); }
function plist(m) {
  if (!m.params.length) return '<p class="muted" style="font-size:16px">No free parameters (all carried over).</p>';
  return `<div class="muted" style="font-size:13px">Fitted values (95% bootstrap range)${tipK('boot')}</div>` + '<ul class="plist">' + m.params.map(p => `<li>${texInline(p.tex)} = <b>${fmt(p.value)}</b> <span class="muted">(${fmt(p.lo)} – ${fmt(p.hi)})</span>${p.atbound ? ' <span class="flag">at bound</span>' : ''}</li>`).join('') + '</ul>';
}
function mcard(g, m) {
  return `<div class="mcard opt"><span class="tag">Optimal · fewest terms within 3 BIC</span><h3>${esc(m.label)}</h3>
    <div class="stats"><span><b>${m.k}</b> parameter${m.k === 1 ? '' : 's'}</span><span>BIC <b>${fmt(m.bic)}</b></span><span>chosen in <b>${pctf(m.pick)}</b> of replicates</span>${tipK('stats')}</div>
    ${m.tex.map(texBlock).join('')}${plist(m)}</div>`;
}
// optimal-control summary (control.js, written by control_report.jl); absent until run_control.jl has run
function controlTable(C) {
  const T = {
    run: 'Environment (normal medium = Stage 3a model; low resource = Stage 4 model) and drug-response scenario: A = coculture fit as selected (Stage 3a; resistant cells keep a cisplatin kill), B = monoculture drug response for both lines. All start from the 50:50 seeding.',
    sched: 'Dose chosen by MPC for each 2-day interval between media changes, restricted to the measured doses 0, 0.62, 1 and 1.47 µM (data-supported mode).',
    tot: 'Total cells N + C on day 14 (model simulation) under MPC, constant 1 µM and the maximum measured dose. Lower is less cancer burden.',
    rf: 'Resistant fraction C/(N + C) on day 14 under MPC and constant 1 µM.',
    dose: 'Cumulative dose (µM·days) under MPC and constant 1 µM.',
    tox: 'Highest toxicity burden T under MPC (literature proxy; the bound is ' + C.Btox + ').'
  };
  const rows = C.rows.map(r => `<tr><td>${esc(r.run)}</td><td>${r.schedule.map(u => u.toFixed(2).replace(/\.?0+$/, '')).join(', ')}</td><td class="num">${Math.round(r.mpc.total)} · ${Math.round(r.const1.total)} · ${Math.round(r.mtd.total)}</td><td class="num">${r.mpc.rf.toFixed(2)} · ${r.const1.rf.toFixed(2)}</td><td class="num">${r.mpc.cum.toFixed(1)} · ${r.const1.cum.toFixed(1)}</td><td class="num">${r.mpc.maxTox.toFixed(3)}</td></tr>`).join('');
  return `<div class="tscroll"><table><tr><th>Run${infoTip(T.run, 'none')}</th><th>MPC schedule (µM)${infoTip(T.sched, 'none')}</th><th>N + C day 14: MPC · 1 µM · 1.47 µM${infoTip(T.tot, 'lower')}</th><th>Resistant fraction: MPC · 1 µM${infoTip(T.rf, 'lower')}</th><th>Dose µM·d: MPC · 1 µM${infoTip(T.dose, 'lower')}</th><th>Max toxicity${infoTip(T.tox, 'lower')}</th></tr>${rows}</table></div>`;
}
// long-run dose + fasting control summary (controlLong.js, written by control_fasting_report.jl)
function controlLongTable(C) {
  const T = {
    run: 'Drug-response scenario (A: coculture fit as selected; B: monoculture drug response). 50:50 start, one ' + C.days + '-day run (days after ' + C.dataDays + ' are beyond the data).',
    sched: 'Dose (µM) chosen by MPC for each 2-day interval, with repeats collapsed (1.47×13 = 13 intervals at 1.47 µM); F marks intervals run in low resource ("fasting", 0.5% FBS). Measured levels only; fasts up to 48 h with at least 2 days of refeeding.',
    day: 'The same continuing run read off on this day (not a separate shorter run).',
    tot: 'Total cells N + C on that day: MPC with fasting · MPC without fasting · constant 1 µM.',
    C: 'Resistant A2780cis cells on that day: MPC with fasting · MPC without fasting · constant 1 µM.',
    dose: 'Cumulative cisplatin (µM·days) and days spent fasting under MPC with fasting, over the whole run.',
    host: 'Lowest body weight (fraction of baseline; limit ' + C.Wmin + ', the cachexia threshold) and highest healthy-tissue loss T (limit 0.25) under MPC with fasting.'
  };
  const lab = (u, f) => (f > 0 ? 'F' : '') + u.toFixed(2).replace(/\.?0+$/, '');
  const compress = r => { const out = []; r.dose.forEach((u, k) => { const l = lab(u, r.fast[k]); const last = out[out.length - 1]; if (last && last.l === l) last.n++; else out.push({ l, n: 1 }); });
    return out.map(o => (o.l.startsWith('F') ? '<b>F</b>' + o.l.slice(1) : o.l) + (o.n > 1 ? '×' + o.n : '')).join(' '); };
  const snaps = r => r.snap && r.snap.length ? r.snap : [{ day: C.days, mpc2: r.mpc2, mpc1: r.mpc1, const1: r.const1 }];
  const rows = C.rows.map(r => snaps(r).map((s, i) => `<tr>${i === 0 ? `<td rowspan="${snaps(r).length}">${esc(r.run)}<div class="muted" style="font-size:12px;max-width:340px">${compress(r)}</div></td>` : ''}<td class="num">${s.day}</td><td class="num">${Math.round(s.mpc2.total)} · ${Math.round(s.mpc1.total)} · ${Math.round(s.const1.total)}</td><td class="num">${Math.round(s.mpc2.C)} · ${Math.round(s.mpc1.C)} · ${Math.round(s.const1.C)}</td>${i === 0 ? `<td class="num" rowspan="${snaps(r).length}">${r.mpc2.cum.toFixed(1)} µM·d · ${Math.round(r.mpc2.fast)} d</td><td class="num" rowspan="${snaps(r).length}">${r.mpc2.minW.toFixed(3)} · ${r.mpc2.maxTox.toFixed(3)}</td>` : ''}</tr>`).join('')).join('');
  return `<div class="tscroll"><table><tr><th>Run and MPC schedule (µM; F = fasting)${infoTip(T.run + ' ' + T.sched, 'none')}</th><th>Day${infoTip(T.day, 'none')}</th><th>N + C: fasting MPC · MPC · 1 µM${infoTip(T.tot, 'lower')}</th><th>Resistant C${infoTip(T.C, 'lower')}</th><th>Dose · fasting days${infoTip(T.dose, 'lower')}</th><th>Min weight · max toxicity${infoTip(T.host, 'Higher weight and lower toxicity are better.')}</th></tr>${rows}</table></div>`;
}
function build() {
  if (!RES) { add('<h2>No results yet</h2><p class="sub">Run run_zoo_fits.jl once; this deck draws from its output.</p>'); return; }
  add(`<div><div class="eyebrow">A2780 / A2780cis · new data · live</div>
       <h1>Staged growth-model fitting</h1><p class="sub" style="margin-top:18px">The optimal model at every stage, redrawn from the latest full run</p>
       <p class="sub" style="margin-top:10px">Run ${esc(RES.generated)} · ${RES.replicates} bootstrap replicates per fit</p></div>${foot()}`, 'dark title');
  const stages = [...new Map(RES.groups.map(g => [g.stage, g])).keys()];
  add(`<div class="eyebrow">How models were chosen</div><h2>Five stages, each building on the last</h2>
       <ul class="bul"><li>Stages: ${stages.map(esc).join(' → ')}.</li>
       <li><b>No time-based terms</b>: delays and drug accumulation come from compartments, second-order effect states or damaged-cell states driven by the dose, so every model works with any dose schedule (needed for optimal control).</li>
       <li><b>Optimal</b>: the fewest free parameters among the candidates within 3 BIC of the lowest, carried into later stages. At most 3 compartments per cell line.</li>
       <li><b>Shared cisplatin mechanism</b>: both lines use one drug-effect structure with their own rates; a shared low-resource structure is tested and used only if it is as good with no more parameters.</li>
       <li>Intervals are 95% bootstrap percentiles; values carried over from earlier stages are held fixed.</li></ul>${foot()}`);
  // at a glance: model name and its equations, split over three slides so the math stays readable
  const geq = m => `<div class="geq">${m.tex.map(t => `\\[${t}\\]`).join('')}</div>`;
  const glanceParts = [['Monocultures: untreated and low resource', g => g.kind === 's1' || g.kind === 's1b'],
                       ['Treated monocultures', g => g.kind === 's2'], ['Cocultures', g => g.kind === 's3' || g.kind === 's3b' || g.kind === 's4']];
  glanceParts.forEach(([name, pick], i) => {
    const rows = RES.groups.filter(pick).map(g => `<tr><td style="width:22%">${esc(g.title)}</td><td><b>${esc(g.optimal.label)}</b> <span class="muted">(${g.optimal.k} parameter${g.optimal.k === 1 ? '' : 's'})</span>${geq(g.optimal)}</td><td class="num">${pctf(g.optimal.pick)}</td></tr>`).join('');
    if (rows) add(`<div class="eyebrow">At a glance · ${i + 1} / 3</div><h2>${esc(name)}</h2><div class="glance tscroll"><table><tr><th>Fit${tipK('fit')}</th><th>Optimal model and its equations${tipK('model')}</th><th>Chosen in bootstrap${tipK('chosen')}</th></tr>${rows}</table></div>${foot()}`);
  });
  for (const g of RES.groups) {
    const ptitle = g.panels.length > 1 ? g.panels[g.mainPanel - 1] : '';
    const cards = mcard(g, g.optimal);
    const multiEq = g.optimal.tex.length > 1;
    const body = multiEq
      // several equations: equations on the left in a compact card, plot on the right
      ? `<div class="cols multi"><div>${cards}</div><div>${groupPlot(g, g.mainPanel, { w: 760, h: 600, title: ptitle })}</div></div>`
      : `<div class="cols"><div>${groupPlot(g, g.mainPanel, { w: 900, h: 560, title: ptitle })}</div><div>${cards}</div></div>`;
    add(`<div class="eyebrow">${esc(g.stage)}</div><h2>${esc(g.title)}</h2><p class="sub">${esc(g.text)}</p>${body}${foot()}`);
  }
  const bullets = RES.groups.map(g => {
    const o = g.optimal;
    return `<li><b>${esc(g.title)}:</b> ${esc(o.label)} (${o.k} parameter${o.k === 1 ? '' : 's'}, chosen in ${pctf(o.pick)} of replicates)${o.reachesZero ? '; reaches zero' : ''}.</li>`;
  }).join('');
  add(`<div class="eyebrow">Key findings</div><h2>What the latest run says</h2><ul class="bul" style="font-size:19px">${bullets}</ul>${foot()}`);
  if (window.CONTROL) add(`<div class="eyebrow">Optimal control</div><h2>MPC dosing on the carried models (50:50 start)</h2><p class="sub">Dose chosen at each media change from the measured doses; toxicity from a literature proxy. Simulations only.</p><div class="ctl-slide"><style>.ctl-slide table{font-size:19px}.ctl-slide td,.ctl-slide th{padding:9px 12px}</style>${controlTable(window.CONTROL)}</div><p class="sub" style="margin-top:14px">${esc(window.CONTROL.finding)}</p>${foot()}`);
  if (window.CONTROL_LONG) add(`<div class="eyebrow">Optimal control · ${window.CONTROL_LONG.days} days</div><h2>Cisplatin and fasting chosen together (50:50 start)</h2><p class="sub">Measured doses and media only; weight limit and fasting protection from the literature. Beyond day ${window.CONTROL_LONG.dataDays} is extrapolation, and the fasting effect is an in-vitro upper bound.</p><div class="ctl-slide">${controlLongTable(window.CONTROL_LONG)}</div>${window.CONTROL_LONG.caveat ? `<p class="sub" style="margin-top:12px">${esc(window.CONTROL_LONG.caveat)}</p>` : ''}${foot()}`);
  add(`<div><div class="eyebrow">Explore further</div><h1>Change a parameter, watch the fit</h1>
       <p class="sub" style="margin-top:18px">Explorer: live sliders for every optimal model · Summary: full tables · Final report: every detailed analysis</p></div>${foot()}`, 'dark title');
}
build();
deck.innerHTML = slides.join('');
const els = [...deck.querySelectorAll('.slide')];
let cur = Math.min(Math.max(parseInt(location.hash.slice(1)) - 1 || 0, 0), els.length - 1);
function show(i) {
  cur = Math.max(0, Math.min(els.length - 1, i));
  els.forEach((e, k) => e.classList.toggle('on', k === cur));
  document.getElementById('count').textContent = `${cur + 1} / ${els.length}`;
  history.replaceState(null, '', '#' + (cur + 1));
}
function fit() {
  const vp = document.getElementById('viewport');
  const s = Math.min(vp.clientWidth / 1600, vp.clientHeight / 900) * 0.98;
  deck.style.transform = `scale(${s})`;
}
document.addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === 'Home') show(0); else if (e.key === 'End') show(els.length - 1);
  else if (e.key === 'f' || e.key === 'F') toggleFs();
});
deck.addEventListener('click', e => { if (e.target.closest('a,button')) return; const r = deck.getBoundingClientRect(); show(e.clientX > r.left + r.width / 2 ? cur + 1 : cur - 1); });
function toggleFs() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
document.getElementById('fs').onclick = toggleFs;
window.addEventListener('resize', fit);
fit(); show(cur);
</script></body></html>
