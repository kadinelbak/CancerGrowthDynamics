<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Data Report</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{background:#f4f7f8}</style>
</head>
<body>
  <iframe id="report" title="New Data Report" src="report.html"></iframe>
  <script>
    document.getElementById('report').addEventListener('load', (event) => {
      const script = event.target.contentDocument.createElement('script');
      script.src = '../../assets/report-display.js';
      event.target.contentDocument.head.append(script);
    });
  </script>
</body>
</html>
